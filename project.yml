name: IslandBuddy
options:
  bundleIdPrefix: com.mattiapedron
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  IslandBuddy:
    type: application
    platform: iOS
    sources:
      - path: Sources/IslandBuddy
      - path: Sources/Shared
    resources:
      - path: Resources/IslandBuddy/Assets.xcassets
    info:
      path: Generated/IslandBuddy-Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSRemindersUsageDescription: "IslandBuddy legge i tuoi promemoria per avvisarti nella Dynamic Island."
        NSCalendarsUsageDescription: "IslandBuddy legge il tuo calendario per avvisarti dei prossimi eventi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiapedron.islandbuddy
        PRODUCT_NAME: IslandBuddy
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: IslandBuddyWidgetExtension
        embed: true

  IslandBuddyWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/IslandBuddyWidget
      - path: Sources/Shared
    resources:
      - path: Resources/IslandBuddy/Assets.xcassets
    info:
      path: Generated/IslandBuddyWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattiapedron.islandbuddy.widget
        PRODUCT_NAME: IslandBuddyWidgetExtension
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true

schemes:
  IslandBuddy:
    build:
      targets:
        IslandBuddy: all
    run:
      config: Debug
    archive:
      config: Release
